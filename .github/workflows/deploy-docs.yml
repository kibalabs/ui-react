name: Deploy Docs
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-deploy-docs
  cancel-in-progress: false
jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    env:
      DOMAIN_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && 'ui-react-docs.kibalabs.com' || 'ui-react-docs-next.kibalabs.com' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: make install
      - name: Build docs
        run: make build-docs
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.SITE_DEPLOYER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SITE_DEPLOYER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SITE_DEPLOYER_AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync ./dist s3://${{ secrets.SITE_DEPLOYMENT_S3_BUCKET_NAME }}/${{ env.DOMAIN_NAME }}/
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.SITE_DEPLOYMENT_CLOUDFRONT_ID }} --paths "/${{ env.DOMAIN_NAME }}/*"
